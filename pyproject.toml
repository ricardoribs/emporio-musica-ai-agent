[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-ai-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "google-genai>=3.0.0,<4.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "pypdf>=7.0.0,<8.0.0",
    "rich>=15.0.0,<16.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.17.4,<1.0.0",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"
emporio-build-db = "emporio_agent.database:main"
emporio-evaluate = "emporio_agent.evaluation:main"
emporio-search-policies = "emporio_agent.policy_retriever:main"
emporio-web = "emporio_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio_agent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
